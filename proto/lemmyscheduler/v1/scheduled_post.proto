syntax = "proto3";

package lemmyscheduler.v1;

import "google/protobuf/timestamp.proto";

enum ScheduledPostStatus {
  SCHEDULED_POST_STATUS_UNSPECIFIED = 0;
  SCHEDULED_POST_STATUS_DRAFT = 1;
  SCHEDULED_POST_STATUS_SCHEDULED = 2;
  SCHEDULED_POST_STATUS_PAUSED = 3;
  SCHEDULED_POST_STATUS_POSTING = 4;
  SCHEDULED_POST_STATUS_POSTED = 5;
  SCHEDULED_POST_STATUS_NEEDS_REVIEW = 6;
  SCHEDULED_POST_STATUS_FAILED = 7;
}

message ScheduledPost {
  int64 id = 1;
  string title = 2;
  string body = 3;
  string url = 4;
  string community = 5;
  bool nsfw = 6;
  ScheduledPostStatus status = 7;
  google.protobuf.Timestamp scheduled_at = 8;
  google.protobuf.Timestamp posted_at = 9;
  string lemmy_post_url = 10;
  reserved 11;
  reserved "version";
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  PostImage title_image = 14;
  repeated PostImage images = 15;
}

message PostImage {
  int64 id = 1;
  string content_type = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ScheduledPostInput {
  string title = 1;
  string body = 2;
  string url = 3;
  string community = 4;
  bool nsfw = 5;
  ScheduledPostStatus status = 6;
  google.protobuf.Timestamp scheduled_at = 7;
}

message CreateScheduledPostRequest {
  ScheduledPostInput scheduled_post = 1;
}

message CreateScheduledPostResponse {
  ScheduledPost scheduled_post = 1;
}

message GetScheduledPostRequest {
  int64 id = 1;
}

message GetScheduledPostResponse {
  ScheduledPost scheduled_post = 1;
}

message ListScheduledPostsRequest {
  repeated ScheduledPostStatus statuses = 1;
  bool descending = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListScheduledPostsResponse {
  repeated ScheduledPost scheduled_posts = 1;
  string next_page_token = 2;
}

message UpdateScheduledPostRequest {
  int64 id = 1;
  reserved 2;
  reserved "version";
  ScheduledPostInput scheduled_post = 3;
}

message UpdateScheduledPostResponse {
  ScheduledPost scheduled_post = 1;
}

message DeleteScheduledPostRequest {
  int64 id = 1;
}

message DeleteScheduledPostResponse {}

enum BulkAction {
  BULK_ACTION_UNSPECIFIED = 0;
  BULK_ACTION_DELETE = 1;
  BULK_ACTION_PAUSE = 2;
  BULK_ACTION_RESUME = 3;
  BULK_ACTION_DELAY = 4;
}

enum BulkSkipReason {
  BULK_SKIP_REASON_UNSPECIFIED = 0;
  BULK_SKIP_REASON_NOT_FOUND = 1;
  BULK_SKIP_REASON_WRONG_STATUS = 2;
  BULK_SKIP_REASON_OVERDUE = 3;
}

message BulkUpdateScheduledPostsRequest {
  // 1 to 200 ids.
  repeated int64 ids = 1;
  BulkAction action = 2;
  // Required and positive (at most 365 days) for DELAY; must be 0 otherwise.
  int64 delay_seconds = 3;
}

message BulkSkippedPost {
  int64 id = 1;
  BulkSkipReason reason = 2;
  string message = 3;
}

message BulkUpdateScheduledPostsResponse {
  repeated int64 updated_ids = 1;
  repeated BulkSkippedPost skipped = 2;
}

service ScheduledPostService {
  rpc CreateScheduledPost(CreateScheduledPostRequest) returns (CreateScheduledPostResponse);
  rpc GetScheduledPost(GetScheduledPostRequest) returns (GetScheduledPostResponse);
  rpc ListScheduledPosts(ListScheduledPostsRequest) returns (ListScheduledPostsResponse);
  rpc UpdateScheduledPost(UpdateScheduledPostRequest) returns (UpdateScheduledPostResponse);
  rpc DeleteScheduledPost(DeleteScheduledPostRequest) returns (DeleteScheduledPostResponse);
  rpc BulkUpdateScheduledPosts(BulkUpdateScheduledPostsRequest) returns (BulkUpdateScheduledPostsResponse);
}
